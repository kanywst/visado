<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="visado sits behind the proxy as an ext_authz service">
<title>visado request flow</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .m{fill:#9198a1;font-size:12px} .b{font-size:15px;font-weight:600} .s{font-size:12px}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7681"/></marker></defs>
<rect width="1000" height="330" fill="#0d1117"/>
<rect x="20" y="40" width="100" height="60" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="1.2"/>
<text class="b" x="70.0" y="66.0" text-anchor="middle">User</text>
<text class="m" x="70.0" y="84.0" text-anchor="middle">IdP login</text>
<rect x="200" y="40" width="130" height="60" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="1.2"/>
<text class="b" x="265.0" y="66.0" text-anchor="middle">Agent A</text>
<text class="m" x="265.0" y="84.0" text-anchor="middle">workload</text>
<rect x="450" y="40" width="170" height="60" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="1.2"/>
<text class="b" x="535.0" y="66.0" text-anchor="middle">Envoy / Istio</text>
<text class="m" x="535.0" y="84.0" text-anchor="middle">agentgateway</text>
<rect x="740" y="40" width="110" height="60" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="1.2"/>
<text class="b" x="795.0" y="66.0" text-anchor="middle">Agent B</text>
<text class="m" x="795.0" y="84.0" text-anchor="middle">workload</text>
<rect x="900" y="40" width="80" height="60" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="1.2"/>
<text class="b" x="940.0" y="66.0" text-anchor="middle">Tool</text>
<text class="m" x="940.0" y="84.0" text-anchor="middle">MCP</text>
<line x1="120" y1="70" x2="198" y2="70" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)"/>
<text class="s" x="159.0" y="60" text-anchor="middle">ID-JAG</text>
<line x1="330" y1="70" x2="448" y2="70" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)"/>
<text class="s" x="389" y="60" text-anchor="middle">WIT + WPT</text>
<text class="m" x="389" y="92" text-anchor="middle">AAT chain</text>
<line x1="620" y1="70" x2="738" y2="70" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)"/>
<text class="s" x="679.0" y="60" text-anchor="middle">Txn-Token</text>
<line x1="850" y1="70" x2="898" y2="70" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="535" y1="100" x2="535" y2="198" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)"/>
<text class="s" x="545" y="154.0">ext_authz</text>
<rect x="440" y="200" width="190" height="80" rx="10" fill="#0c2d6b" stroke="#58a6ff" stroke-width="2"/>
<text class="b" x="535.0" y="236.0" text-anchor="middle">visado</text>
<text class="m" x="535.0" y="254.0" text-anchor="middle">verify · decide · mint</text>
<rect x="760" y="210" width="170" height="60" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="1.2"/>
<text class="b" x="845.0" y="236.0" text-anchor="middle">Policy decision point</text>
<text class="m" x="845.0" y="254.0" text-anchor="middle">OPA, Cerbos, …</text>
<line x1="630" y1="240" x2="758" y2="240" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)"/>
<text class="s" x="694.0" y="230" text-anchor="middle">AuthZEN</text>
<text class="m" x="40" y="208">1  verify the WIT and its proof</text>
<text class="m" x="40" y="226">2  verify the delegation chain</text>
<text class="m" x="40" y="244">3  ask the PDP, deny on any error</text>
<text class="m" x="40" y="262">4  mint a Transaction Token</text>
<text class="m" x="40" y="280">5  strip inbound credentials</text>
</svg>