# agentgateway in front of the same echo upstream as Envoy. Its extAuthz
# policy calls visado over gRPC with the same body settings as Envoy's
# ext_authz filter: the body for MCP arguments and for Content-Digest, as raw
# bytes. failureMode: deny and packAsBytes: true are required
# (docs/bindings.md, Proxy settings); agentgateway has no raw-header option,
# and visado denies a header value it decoded lossily.
binds:
- port: 10001
  listeners:
  - name: tools
    protocol: HTTP
    routes:
    # The MCP endpoint: agentgateway's MCP backend in front of a real MCP
    # server (mcp/server.py), behind the same extAuthz policy. visado reads
    # the tool name and arguments from the tools/call body and checks them
    # against the AAT chain before agentgateway handles the MCP message.
    - name: mcp
      hostnames: ["tools.td.example"]
      matches:
      - path:
          exact: /mcp
      backends:
      - mcp:
          statefulMode: stateless
          prefixMode: never
          targets:
          - name: files
            mcp:
              host: http://mcp:8000/mcp
      policies:
        extAuthz:
          host: 172.30.91.10:9191
          protocol:
            grpc: {}
          failureMode: deny
          includeRequestBody:
            maxRequestBytes: 65536
            allowPartialMessage: false
            packAsBytes: true
    - name: tools
      hostnames: ["tools.td.example"]
      backends:
      - host: upstream:8080
      policies:
        extAuthz:
          # visado's address on the internal authz network (compose.yaml).
          host: 172.30.91.10:9191
          protocol:
            grpc: {}
          failureMode: deny
          includeRequestBody:
            maxRequestBytes: 65536
            allowPartialMessage: false
            packAsBytes: true
