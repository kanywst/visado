# A local lab: Envoy and agentgateway call visado over ext_authz, visado asks
# an AuthZEN PDP (OPA with the AuthZEN plugin), and allowed requests reach an
# echo server that shows the headers it received. SPIRE issues the workloads'
# WITs, X.509-SVIDs and JWT-SVIDs.
services:
  envoy:
    image: envoyproxy/envoy:v1.34.1
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
      - gateway-svid:/etc/envoy/spire:ro
    ports:
      - "10000:10000"
      # mTLS with X.509-SVIDs.
      - "10443:10443"
    networks: [default, authz]
    depends_on:
      visado: { condition: service_started }
      upstream: { condition: service_started }
      gateway-svid: { condition: service_completed_successfully }

  # A second front proxy: agentgateway's extAuthz policy calls visado over
  # gRPC on the authz network, in front of the same upstream.
  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.7.0
    command: ["-f", "/etc/agentgateway/config.yaml"]
    volumes:
      - ./agentgateway.yaml:/etc/agentgateway/config.yaml:ro
    ports:
      - "10001:10001"
    networks: [default, authz]
    depends_on:
      visado: { condition: service_started }
      upstream: { condition: service_started }

  visado:
    build:
      context: ../..
    volumes:
      - ./visado.toml:/etc/visado/visado.toml:ro
      - ../local/keys:/etc/visado/keys:ro
      - spire-bundle:/etc/visado/spire:ro
      - keycloak-jwks:/etc/visado/keycloak:ro
    # The chain view and JWKS, published on the host's loopback address only.
    # Inside the lab, any container on the default network can still read the
    # view (it shows caller and principal identities): the Host allow-list
    # stops browser rebinding, not other clients. Do not enable it like this
    # outside a lab.
    ports:
      - "127.0.0.1:8080:8080"
    # The gRPC port listens only on the authz network, which only the proxies
    # (Envoy and agentgateway) share; the other containers reach visado's
    # HTTP port alone.
    networks:
      default: {}
      authz: { ipv4_address: 172.30.91.10 }
    depends_on:
      pdp: { condition: service_started }
      jaeger: { condition: service_started }
      wit-config: { condition: service_completed_successfully }
      keycloak-jwks: { condition: service_completed_successfully }
      casdoor-link: { condition: service_completed_successfully }

  # SPIRE v1.16.0 with experimental WIT-SVIDs. The agent attests with a join
  # token; agent-a, agent-b and agent-z are Unix users in the agent container,
  # told apart by the unix workload attestor.
  spire-server:
    build: ./spire
    command: ["spire-server", "run", "-config", "/etc/spire/server.conf"]
    volumes:
      - ./spire/server.conf:/etc/spire/server.conf:ro
      - spire-server-socket:/run/spire/server
    healthcheck:
      test: ["CMD", "spire-server", "healthcheck", "-socketPath", "/run/spire/server/api.sock"]
      interval: 1s
      retries: 60

  spire-setup:
    build: ./spire
    command: ["/lab/setup.sh"]
    volumes:
      - ./spire/setup.sh:/lab/setup.sh:ro
      - spire-server-socket:/run/spire/server
      - spire-shared:/run/spire/shared
      - spire-bundle:/out
    depends_on:
      spire-server: { condition: service_healthy }

  spire-agent:
    build: ./spire
    command:
      - spire-agent
      - run
      - -config
      - /etc/spire/agent.conf
      - -joinTokenFile
      - /run/spire/shared/join-token
    volumes:
      - ./spire/agent.conf:/etc/spire/agent.conf:ro
      - spire-shared:/run/spire/shared:ro
      - spire-agent-socket:/run/spire/agent
    healthcheck:
      test: ["CMD", "spire-agent", "healthcheck", "-socketPath", "/run/spire/agent/api.sock"]
      interval: 1s
      retries: 60
    depends_on:
      spire-setup: { condition: service_completed_successfully }

  # Writes the SPIRE WIT bundle that visado trusts. spire-setup writes the
  # X.509 and JWT bundles next to it.
  wit-config:
    build: ./spire
    command: ["/lab/wit-config.sh"]
    pid: "service:spire-agent"
    volumes:
      - ./spire/wit-config.sh:/lab/wit-config.sh:ro
      - spire-agent-socket:/run/spire/agent
      - spire-bundle:/out
    depends_on:
      spire-agent: { condition: service_healthy }

  # Writes the gateway's X.509-SVID for Envoy's mTLS listener.
  gateway-svid:
    build: ./spire
    command: ["/lab/gateway-svid.sh"]
    pid: "service:spire-agent"
    volumes:
      - ./spire/gateway-svid.sh:/lab/gateway-svid.sh:ro
      - spire-agent-socket:/run/spire/agent
      - gateway-svid:/out
    depends_on:
      spire-agent: { condition: service_healthy }

  # Keycloak as the resource authorization server: it issues the access
  # tokens for tools.td.example, bearer or DPoP-bound (RFC 9449), to the
  # agent-a client (client_credentials). Published on the host's loopback
  # address for demo.sh; the issuer is fixed by KC_HOSTNAME, so clients must
  # call it as keycloak.td.example:8180.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    # identity-assertion-jwt (experimental) lets the JWT authorization grant
    # (RFC 7523) take an ID-JAG from Casdoor.
    command: ["start-dev", "--import-realm", "--features=identity-assertion-jwt"]
    environment:
      KC_HOSTNAME: http://keycloak.td.example:8180
      # Demo credentials, used by casdoor-link.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-lab-password
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "127.0.0.1:8180:8080"

  # Writes Keycloak's signing keys for visado's [[oauth_issuers]] once the
  # realm is up.
  keycloak-jwks:
    build: ./spire
    command: ["/lab/jwks.sh"]
    volumes:
      - ./keycloak/jwks.sh:/lab/jwks.sh:ro
      - keycloak-jwks:/out
    depends_on:
      keycloak: { condition: service_started }

  # Casdoor v4.26.0, the user's IdP: it issues ID-JAGs
  # (draft-ietf-oauth-identity-assertion-authz-grant) by token exchange, which
  # agent-a redeems at Keycloak. v4.27.0 and later need a commercial license
  # for ID-JAGs. The issuer is fixed by origin; published on the host's
  # loopback address for demo.sh.
  casdoor:
    image: casbin/casdoor:v4.26.0
    environment:
      driverName: sqlite
      dataSourceName: file:/tmp/casdoor.db?cache=shared
      origin: http://casdoor.td.example:8190
    volumes:
      - ./casdoor/init_data.json:/init_data.json:ro
    ports:
      - "127.0.0.1:8190:8000"

  # Links bob in Keycloak to bob's Casdoor ID, which Casdoor picks at import.
  casdoor-link:
    build: ./spire
    command: ["/lab/link.sh"]
    environment:
      KEYCLOAK_ADMIN_PASSWORD: admin-lab-password
    volumes:
      - ./casdoor/link.sh:/lab/link.sh:ro
    depends_on:
      keycloak: { condition: service_started }
      casdoor: { condition: service_started }

  pdp:
    image: ghcr.io/kanywst/opa-authzen-plugin:0.12.1
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --config-file=/config.yaml
      - /policy/
    volumes:
      - ./pdp.yaml:/config.yaml:ro
      - ./policy:/policy:ro

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    ports:
      - "16686:16686"

  upstream:
    image: mendhak/http-https-echo:37
    environment:
      HTTP_PORT: "8080"

  # The demo runner: `docker compose run --rm demo` runs demo.sh with
  # nothing on the host but Docker. It shares the SPIRE agent's PID
  # namespace and socket so each workload fetches its own SVID, and reads
  # the lab's logs through the Docker socket.
  demo:
    profiles: [demo]
    build:
      context: ../..
      dockerfile: deploy/lab/demo/Dockerfile
    pid: "service:spire-agent"
    volumes:
      - spire-agent-socket:/run/spire/agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      envoy: { condition: service_started }
      agentgateway: { condition: service_started }
      jaeger: { condition: service_started }
      spire-agent: { condition: service_healthy }

networks:
  authz:
    internal: true
    ipam:
      config: [{ subnet: 172.30.91.0/24 }]

volumes:
  spire-server-socket:
  spire-shared:
  spire-agent-socket:
  spire-bundle:
  gateway-svid:
  keycloak-jwks:
