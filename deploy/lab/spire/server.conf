server {
  bind_address = "0.0.0.0"
  bind_port = "8081"
  socket_path = "/run/spire/server/api.sock"
  trust_domain = "td.example"
  data_dir = "/var/lib/spire/server"
  log_level = "INFO"

  experimental {
    enable_wit_svids = true
    wit_issuer = "https://spire.td.example"
  }
}

plugins {
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      connection_string = "/var/lib/spire/server/datastore.sqlite3"
    }
  }
  KeyManager "disk" {
    plugin_data {
      keys_path = "/var/lib/spire/server/keys.json"
    }
  }
  NodeAttestor "join_token" {
    plugin_data {}
  }
}
