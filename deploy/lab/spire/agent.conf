agent {
  server_address = "spire-server"
  server_port = "8081"
  socket_path = "/run/spire/agent/api.sock"
  trust_domain = "td.example"
  trust_bundle_path = "/run/spire/shared/bundle.pem"
  data_dir = "/var/lib/spire/agent"
  log_level = "INFO"

  experimental {
    enable_wit_svids = true
  }
}

plugins {
  KeyManager "disk" {
    plugin_data {
      directory = "/var/lib/spire/agent"
    }
  }
  NodeAttestor "join_token" {
    plugin_data {}
  }
  WorkloadAttestor "unix" {
    plugin_data {}
  }
}
