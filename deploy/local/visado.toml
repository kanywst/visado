# Local demo configuration. The keys under keys/ are fixed demo keys from
# crates/testkit; anyone can sign with them.
trust_domain = "td.example"
grpc_listen = "127.0.0.1:9191"
http_listen = "127.0.0.1:8080"
txn_lifetime = 60
default_scope = "tickets.read"
allowed_authorities = ["tools.td.example"]
internal_callers = ["spiffe://td.example/agent-a"]

# The private JWK that signs Transaction Tokens: OKP Ed25519 or EC P-256, or
# RSA (at least 2048 bits) to sign RS256. The public half is served at
# /.well-known/jwks.json.
[signing_key]
kid = "txn-1"
jwk_file = "keys/txn-signing.private.jwk.json"

[pdp]
endpoint = "http://127.0.0.1:8181/access/v1/evaluation"
timeout_ms = 500

[[wit_issuers]]
trust_domain = "td.example"
keys = [{ kid = "wit-1", jwk_file = "keys/wit-issuer.jwk.json" }]
# Or a JWK set, such as a SPIRE WIT bundle (read at startup; a key without
# alg gets ES256 for P-256 and EdDSA for Ed25519):
# jwks_file = "spire/wit-bundle.json"

[[oauth_issuers]]
issuer = "https://idp.example"
audience = "https://tools.td.example/admin/roles"
jwks_file = "keys/oauth-jwks.json"

# Recent decisions and their delegation chains at http://127.0.0.1:8080/chain.
# Shows caller and principal identities; see docs/design.md before enabling
# it anywhere but a laptop.
# [chain_view]
# enabled = true
# capacity = 256
