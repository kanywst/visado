# Local demo configuration. The keys under keys/ are fixed demo keys from
# crates/testkit; anyone can sign with them.
trust_domain = "td.example"
grpc_listen = "127.0.0.1:9191"
http_listen = "127.0.0.1:8080"
txn_lifetime = 60
default_scope = "tickets.read"
allowed_authorities = ["tools.td.example"]
internal_callers = ["spiffe://td.example/agent-a"]

[signing_key]
kid = "txn-1"
jwk_file = "keys/txn-signing.private.jwk.json"

[pdp]
endpoint = "http://127.0.0.1:8181/access/v1/evaluation"
timeout_ms = 500

[[wit_issuers]]
trust_domain = "td.example"
keys = [{ kid = "wit-1", jwk_file = "keys/wit-issuer.jwk.json" }]

[[oauth_issuers]]
issuer = "https://idp.example"
audience = "https://tools.td.example/admin/roles"
jwks_file = "keys/oauth-jwks.json"
