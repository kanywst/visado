name: pages

on:
  push:
    branches: [main]
    paths: &site-paths
      - "website/**"
      - "docs/**"
      - "deploy/lab/README.md"
      - "README.md"
      - "SPEC-MAP.md"
      - "ROADMAP.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - ".github/workflows/pages.yml"
  pull_request:
    paths: *site-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build and check links
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: install
        run: npm ci
      # `npm run build` runs scripts/sync-docs.mjs first, which copies the
      # repository Markdown into src/content/docs.
      - name: build
        run: npm run build
      # The site is served under /visado, so check it from a directory laid out
      # the same way. Offline: internal links and anchors only, no network.
      - name: lay out the site under its base path
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp -R dist "$RUNNER_TEMP/site/visado"
      - name: check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --no-progress
            --root-dir ${{ runner.temp }}/site
            --index-files index.html
            ${{ runner.temp }}/site/visado
          fail: true
          jobSummary: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    name: deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
