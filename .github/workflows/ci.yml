name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: fmt / clippy / test / doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --all-targets --locked
      - name: doctests
        run: cargo test --workspace --doc --locked
      - name: docs build without warnings
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --locked
      - name: conformance vectors are committed as generated
        run: git diff --exit-code conformance/

  msrv:
    name: build on the minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --workspace --locked

  lab:
    name: lab (Envoy, visado, AuthZEN PDP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: start the lab
        run: docker compose -f deploy/lab/compose.yaml up -d --build
      - name: run the scenarios (OPA with the AuthZEN plugin)
        run: deploy/lab/demo.sh
      # The same scenarios with Cerbos as the PDP. visado.cerbos.toml must
      # differ from visado.toml only in [pdp], and the ported policy must pass
      # its own tests, before visado is restarted against Cerbos.
      - name: check the Cerbos configuration and policy
        run: |
          diff <(sed '/^\[pdp\]/,/^$/d' deploy/lab/visado.toml) <(sed '/^\[pdp\]/,/^$/d' deploy/lab/visado.cerbos.toml)
          docker compose -f deploy/lab/compose.yaml -f deploy/lab/compose.cerbos.yaml run --rm --no-deps cerbos compile /policies
      - name: switch the lab to Cerbos
        run: docker compose -f deploy/lab/compose.yaml -f deploy/lab/compose.cerbos.yaml up -d cerbos visado
      - name: run the scenarios (Cerbos)
        run: deploy/lab/demo.sh
      - name: logs
        if: failure()
        run: docker compose -f deploy/lab/compose.yaml -f deploy/lab/compose.cerbos.yaml logs

  fuzz:
    name: fuzz the parsers
    runs-on: ubuntu-latest
    env:
      # The workspace-wide `-D warnings` would be appended to cargo-fuzz's own
      # sanitizer RUSTFLAGS, turning a warning anywhere in the dependency tree
      # into a failed fuzz build. Lints are enforced by the `rust` job.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # libFuzzer's instrumentation needs nightly; the workspace stays on stable.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: seed the corpus from the conformance vectors
        run: ./fuzz/seed-corpus.sh
      # A short run per target: a regression gate, not a hunt. See fuzz/README.md.
      - name: fuzz
        run: |
          set -euo pipefail
          for target in txn_token_verify txn_token_request aat_verify aat_decode authzen_response credentials_authenticate; do
            echo "::group::$target"
            cargo +nightly fuzz run "$target" -- -max_total_time=30 -print_final_stats=1
            echo "::endgroup::"
          done
      - name: report any crash
        if: failure()
        run: |
          for dir in fuzz/artifacts/*/; do
            for artifact in "$dir"*; do
              [ -e "$artifact" ] || continue
              echo "::error::crash artifact $artifact"
              xxd "$artifact" | head -20
            done
          done

  coverage:
    name: test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      # The test policy in CONTRIBUTING.md: line coverage stays at 80% or more.
      - name: measure
        run: cargo llvm-cov --workspace --all-targets --locked --summary-only --fail-under-lines 80

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2

  lint:
    name: markdown / workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: every commit has Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list "$BASE".."$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit $sha has no Signed-off-by line"
              missing=1
            fi
          done
          exit "$missing"
