version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions-all:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/website"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(website)"
    groups:
      website-all:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - "/"
      - "/deploy/lab/spire"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(docker)"
