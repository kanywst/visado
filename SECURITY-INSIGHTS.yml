header:
  schema-version: 2.0.0
  last-updated: "2026-11-23"
  last-reviewed: "2026-11-19"
  url: https://raw.githubusercontent.com/kanywst/visado/main/SECURITY-INSIGHTS.yml
project:
  name: visado
  homepage: https://github.com/kanywst/visado
  roadmap: https://github.com/kanywst/visado/blob/main/ROADMAP.md
  administrators:
    - name: kanywst
      primary: true
  repositories:
    - name: visado
      url: https://github.com/kanywst/visado
      comment: Source, conformance vectors and documentation.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    policy: https://github.com/kanywst/visado/blob/main/SECURITY.md
repository:
  url: https://github.com/kanywst/visado
  status: active
  accepts-change-request: true
  accepts-automated-change-request: true
  no-third-party-packages: false
  documentation:
    contributing-guide: https://github.com/kanywst/visado/blob/main/CONTRIBUTING.md
    dependency-management-policy: https://github.com/kanywst/visado/blob/main/docs/dependencies.md
    governance: https://github.com/kanywst/visado/blob/main/GOVERNANCE.md
    security-policy: https://github.com/kanywst/visado/blob/main/SECURITY.md
  core-team:
    - name: kanywst
      primary: true
  license:
    url: https://github.com/kanywst/visado/blob/main/LICENSE
    expression: Apache-2.0
  security:
    assessments:
      self:
        comment: Assurance case covering what visado protects against, its trust boundaries and the weaknesses it counters. The threat model is in docs/research/05-threats.md.
        evidence: https://github.com/kanywst/visado/blob/main/docs/assurance-case.md
    tools:
      - name: OpenSSF Scorecard
        type: SCA
        rulesets: [default]
        integration:
          adhoc: false
          ci: true
          release: false
      - name: CodeQL
        type: SAST
        rulesets: [default]
        integration:
          adhoc: false
          ci: true
          release: false
      - name: cargo-deny
        type: SCA
        rulesets: [default]
        integration:
          adhoc: false
          ci: true
          release: false
      - name: cargo-fuzz
        type: fuzzing
        rulesets: [default]
        integration:
          adhoc: true
          ci: true
          release: false
        comment: libFuzzer targets for the credential, Transaction Token, AAT and AuthZEN response parsers; a short run per target on every push and pull request.
  release:
    changelog: https://github.com/kanywst/visado/blob/main/CHANGELOG.md
    automated-pipeline: true
    distribution-points:
      - uri: https://github.com/kanywst/visado/releases
        comment: Binaries with SBOM, cosign bundles and SLSA provenance.
