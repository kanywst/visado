[workspace]
resolver = "3"
members = ["crates/txn-token"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/kanywst/visado"
authors = ["The visado authors"]
keywords = ["transaction-tokens", "wimse", "oauth", "authorization", "agents"]
categories = ["authentication", "cryptography"]

[workspace.dependencies]
wimsey-jose = "0.10.1"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
strip = true
