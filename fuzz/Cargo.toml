[package]
name = "visado-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Not a workspace member: cargo-fuzz builds it with its own profile and
# sanitizer flags, and it must not drag the workspace onto nightly.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
wimsey-jose = "0.10.1"
visado-txn-token = { path = "../crates/txn-token" }
visado-chain = { path = "../crates/chain" }
visado-chain-aat = { path = "../crates/chain-aat" }
visado-authzen = { path = "../crates/authzen" }
visado-credentials = { path = "../crates/credentials" }
visado-testkit = { path = "../crates/testkit" }

[[bin]]
name = "txn_token_verify"
path = "fuzz_targets/txn_token_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "txn_token_request"
path = "fuzz_targets/txn_token_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "aat_verify"
path = "fuzz_targets/aat_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "aat_decode"
path = "fuzz_targets/aat_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "authzen_response"
path = "fuzz_targets/authzen_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "credentials_authenticate"
path = "fuzz_targets/credentials_authenticate.rs"
test = false
doc = false
bench = false
